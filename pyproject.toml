[project]
name = "hinge-automation"
version = "0.1.0"
description = "Human-in-the-loop Hinge helper that drives an Android emulator"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9.0",
    "mss>=10.2.0",
    "openai>=3.20.0",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
