<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hinge-automation</title>
<style>
  :root {
    --bg: #120e0c;
    --surface: #2a1d16;
    --raised: #33241b;
    --ink: #f3ece3;
    --muted: #9c8f80;
    --faint: #6a5d51;
    --tan: #a8865f;
    --rose: #d4a35a;
    --rose-ink: #120e0c;
    --lip: #0b0807;
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(0.19, 1, 0.22, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 300 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(900px 700px at var(--lx, 78%) 8%, rgba(212,163,90,0.13), transparent 70%);
    transition: background-position 1s var(--ease);
  }
  .grain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; opacity: 0.06; mix-blend-mode: overlay; }
  main {
    min-height: 100vh;
    display: grid;
    grid-template-columns: auto minmax(360px, 560px);
    align-items: start;
    gap: 64px;
    justify-content: center;
    padding: 32px 40px;
  }

  .phone {
    height: calc(100vh - 64px);
    min-height: 520px;
    aspect-ratio: 415 / 923;
    border-radius: 36px;
    background: var(--lip);
    padding: 9px;
    position: sticky;
    top: 32px;
    box-shadow: 0 0 0 1px rgba(212,163,90,0.45), 0 50px 90px -30px #000;
    clip-path: inset(100% 0 0 0 round 36px);
    animation: wipe 1.3s var(--ease) 0.15s forwards, breathe 7s ease-in-out 1.5s infinite;
  }
  @keyframes wipe { to { clip-path: inset(-40px -40px -140px -40px round 36px); } }
  @keyframes breathe { 50% { translate: 0 -3px; } }
  .phone img, .phone .off {
    width: 100%;
    height: 100%;
    border-radius: 28px;
    display: block;
    object-fit: cover;
    background: var(--surface);
  }
  .phone .off {
    display: none;
    place-items: center;
    text-align: center;
    padding: 28px;
    color: var(--muted);
    font: 400 18px/1.4 var(--serif);
  }
  .phone.down img { display: none; }
  .phone.down .off { display: grid; }

  .panel { display: flex; flex-direction: column; gap: 34px; padding: 4px 0 32px; }
  .panel > * { opacity: 0; animation: rise 1.2s var(--ease) forwards; }
  .panel > :nth-child(1) { animation-delay: 0.6s; }
  .panel > :nth-child(2) { animation-delay: 0.72s; }
  .panel > :nth-child(3) { animation-delay: 0.84s; }
  .panel > :nth-child(n+4) { animation-delay: 0.96s; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 22px; border-bottom: 1px solid rgba(168,134,95,0.3); }
  h1 { margin: 0; font: 400 40px/1 var(--serif); letter-spacing: -0.6px; }
  .count { font: 400 64px/0.85 var(--serif); color: var(--rose); font-variant-numeric: tabular-nums; text-align: right; }
  .count span { display: inline-block; }
  .count span.bump { animation: bump 900ms var(--ease); }
  @keyframes bump { 30% { transform: translateY(-8px); color: var(--ink); } }
  .count small { display: block; font: 400 11px var(--sans); letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); margin: 10px 0 0; }

  .settings { display: grid; }
  .row { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(168,134,95,0.16); }
  .row > span { color: var(--muted); font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; }
  .seg { display: flex; flex-wrap: wrap; gap: 22px; width: fit-content; }
  .seg button {
    border: 0; background: transparent; color: var(--muted);
    font: 400 18px var(--serif); padding: 4px 0; cursor: pointer;
    background-image: linear-gradient(var(--rose), var(--rose));
    background-repeat: no-repeat; background-position: 0 100%; background-size: 0 1px;
    transition: color 500ms var(--ease), background-size 700ms var(--ease);
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { color: var(--ink); background-size: 100% 1px; }
  .seg button:disabled { cursor: default; opacity: 0.5; }
  .seg button:focus-visible { outline: 1px solid var(--rose); outline-offset: 4px; }
  input[type=number] {
    width: 80px; font: 400 22px var(--serif); color: var(--rose); background: transparent;
    border: 0; border-bottom: 1px solid rgba(168,134,95,0.4); border-radius: 0; padding: 2px 0;
    font-variant-numeric: tabular-nums;
  }
  input[type=number]:focus, textarea:focus { outline: none; border-color: var(--rose); }
  .note { margin: 10px 0 0 124px; color: var(--rose); font: italic 400 15px var(--serif); }
  .note:empty { display: none; }

  .bar { display: flex; align-items: center; gap: 22px; }
  .status { color: var(--muted); font: italic 400 16px var(--serif); }
  .summary { margin: 0; color: var(--muted); display: none; font: italic 400 18px var(--serif); }
  .running .settings { display: none; }
  .running .summary { display: block; }
  .go {
    align-self: flex-start;
    border: 1px solid var(--rose); border-radius: 0; cursor: pointer;
    font: 400 20px var(--serif); letter-spacing: 0.3px;
    padding: 14px 40px;
    background: var(--rose); color: var(--rose-ink);
    transition: background-color 500ms var(--ease), color 500ms var(--ease), border-color 500ms;
  }
  .go:hover { background: transparent; color: var(--rose); }
  .go.stop { background: transparent; color: var(--ink); border-color: rgba(216,205,191,0.4); }
  .go.stop:hover { border-color: var(--ink); }

  .ask { background: var(--surface); border-left: 1px solid var(--rose); padding: 26px 26px 22px; display: none; }
  .ask.on { display: block; animation: rise 900ms var(--ease); }
  .ask p:not(.hint) { margin: 0 0 20px; font: 400 23px/1.3 var(--serif); }
  .keys { display: flex; gap: 12px; flex-wrap: wrap; }
  .key {
    width: 96px; height: 92px;
    display: grid; grid-template-rows: 1fr auto; place-items: center;
    padding: 14px 0 12px;
    border: 1px solid rgba(216,205,191,0.25); border-radius: 0; cursor: pointer;
    background: transparent; color: var(--ink);
    transition: background-color 400ms var(--ease), color 400ms, border-color 400ms, transform 120ms;
  }
  .key b { font: 400 36px/1 var(--serif); }
  .key small { font: 400 10px var(--sans); letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .key:hover { border-color: var(--ink); }
  .key:active, .key.hit { transform: translateY(2px); background: var(--raised); }
  .key.like { border-color: var(--rose); color: var(--rose); }
  .key.like small { color: var(--rose); opacity: 0.8; }
  .key.like:hover, .key.like.hit { background: var(--rose); color: var(--rose-ink); }
  .key.like:hover small, .key.like.hit small { color: var(--rose-ink); }
  textarea {
    width: 100%; min-height: 80px; resize: vertical;
    font: italic 400 20px/1.4 var(--serif); color: var(--ink);
    background: transparent; border: 0; border-bottom: 1px solid rgba(168,134,95,0.4); border-radius: 0; padding: 8px 0 12px; margin-bottom: 18px;
  }
  .hint { color: var(--muted); font-size: 12px; letter-spacing: 0.3px; margin: 16px 0 0; }

  .log {
    margin: 0; padding: 0 0 0 16px; list-style: none; border-left: 1px solid rgba(168,134,95,0.25);
    font: 12px/1.75 Menlo, Consolas, monospace; color: var(--faint);
    max-height: 240px; overflow-y: auto;
  }
  .log li:last-child { color: var(--ink); }

  details { border-top: 1px solid rgba(168,134,95,0.3); padding: 18px 0 0; }
  summary { cursor: pointer; color: var(--muted); font: 400 17px var(--serif); list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+"; display: inline-block; width: 22px; color: var(--rose); transition: transform 500ms var(--ease); }
  details[open] summary::before { transform: rotate(45deg); }
  summary:hover { color: var(--ink); }
  details textarea { min-height: 240px; margin: 16px 0 12px; font: 300 14px/1.7 var(--sans); border: 1px solid rgba(168,134,95,0.25); padding: 12px 14px; }
  .small { background: transparent; color: var(--rose); border: 0; border-bottom: 1px solid var(--rose); border-radius: 0; padding: 4px 0; font: 400 17px var(--serif); cursor: pointer; }
  .small:hover { color: var(--ink); border-color: var(--ink); }
  .saved { color: var(--muted); font: italic 400 15px var(--serif); margin-left: 14px; }

  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 28px; }
    .phone { position: static; height: auto; width: min(100%, 340px); min-height: 0; aspect-ratio: auto; justify-self: center; }
    .phone img, .phone .off { height: auto; aspect-ratio: 415 / 923; }
    .row { grid-template-columns: 1fr; gap: 8px; }
    .note { margin-left: 0; }
    h1 { font-size: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<main>
  <div class="phone" id="phone">
    <img id="screen" alt="Live view of the emulator screen">
    <div class="off" id="off">Emulator window not found.<br>Start it with .\run-hinge.ps1</div>
  </div>

  <section class="panel">
    <header>
      <h1>hinge-automation</h1>
      <div class="count"><span id="today">0</span><small>liked today</small></div>
    </header>

    <div class="settings" id="settings">
      <div class="row"><span>Mode</span>
        <div class="seg" data-key="auto">
          <button data-value="false">Ask me</button><button data-value="true">Auto</button>
        </div>
      </div>
      <p class="note" id="auto-note"></p>
      <div class="row"><span>Comment</span>
        <div class="seg" data-key="source">
          <button data-value="none">None</button><button data-value="list">From my list</button><button data-value="model">Vision model</button>
        </div>
      </div>
      <div class="row"><span>Scroll</span>
        <div class="seg" data-key="full">
          <button data-value="false">Random depth</button><button data-value="true">Whole profile</button>
        </div>
      </div>
      <div class="row"><span>Daily cap</span><input type="number" id="cap" min="1" max="100" value="5"></div>
      <p class="note" id="cap-note"></p>
    </div>

    <p class="summary" id="summary"></p>

    <div class="bar"><button class="go" id="go">Start</button><span class="status" id="status"></span></div>

    <div class="ask" id="decide">
      <p id="question"></p>
      <div class="keys">
        <button class="key like" data-answer="y"><b>y</b><small>like</small></button>
        <button class="key" data-answer="n"><b>n</b><small>skip</small></button>
        <button class="key" data-answer="q"><b>q</b><small>stop</small></button>
      </div>
      <p class="hint">Press y, n or q on your keyboard.</p>
    </div>

    <div class="ask" id="comment">
      <p>Comment to send with the like</p>
      <textarea id="comment-text" maxlength="300"></textarea>
      <div class="keys">
        <button class="key like" id="send"><b>&#8629;</b><small>send</small></button>
        <button class="key" id="bare"><b>-</b><small>no comment</small></button>
      </div>
      <p class="hint">Edit the text to send your own words. Printable ASCII only.</p>
    </div>

    <ul class="log" id="log"></ul>

    <details>
      <summary>My comment list (prompts.txt)</summary>
      <textarea id="prompts" spellcheck="true"></textarea>
      <button class="small" id="save-prompts">Save</button><span class="saved" id="saved"></span>
    </details>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const settings = { auto: "false", source: "list", full: "false" };
try { Object.assign(settings, JSON.parse(localStorage.getItem("hinge-settings") || "{}")); } catch (e) {}
try { $("cap").value = localStorage.getItem("hinge-cap") || 5; } catch (e) {}
let running = false, pending = null, suggestion = "", today = 0;

function paintSettings() {
  document.querySelectorAll(".seg").forEach((seg) => {
    seg.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.value === settings[seg.dataset.key]));
      b.disabled = running;
    });
  });
  $("cap").disabled = running;
  $("auto-note").textContent = settings.auto === "true" ? "Auto likes every profile it scans until the daily cap, without asking." : "";
  const cap = Number($("cap").value) || 0;
  $("cap-note").textContent = !running && today >= cap ? `Already ${today} today. Raise the cap above ${today} to like more.` : "";
}

document.querySelectorAll(".seg").forEach((seg) => seg.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || running) return;
  settings[seg.dataset.key] = b.dataset.value;
  try { localStorage.setItem("hinge-settings", JSON.stringify(settings)); } catch (err) {}
  paintSettings();
}));

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  return r.json();
}

$("go").addEventListener("click", () => {
  if (running) return post("/stop");
  try { localStorage.setItem("hinge-cap", $("cap").value); } catch (e) {}
  post("/start", {
    cap: Number($("cap").value) || 5,
    auto: settings.auto === "true",
    full: settings.full === "true",
    source: settings.source,
    provider: "auto",
  });
});

function answer(value) { post("/answer", { answer: value }); pending = null; render(); }
document.querySelectorAll("[data-answer]").forEach((b) => b.addEventListener("click", () => answer(b.dataset.answer)));
$("send").addEventListener("click", () => {
  const text = $("comment-text").value.trim();
  answer(text === suggestion ? "" : text || "-");
});
$("bare").addEventListener("click", () => answer("-"));
document.addEventListener("keydown", (e) => {
  if (!pending || pending.kind !== "decide" || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const key = document.querySelector(`[data-answer="${e.key.toLowerCase()}"]`);
  if (!key) return;
  key.classList.add("hit");
  setTimeout(() => key.classList.remove("hit"), 120);
  answer(e.key.toLowerCase());
});
$("comment-text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); }
});

let shown = "";
function render() {
  $("decide").classList.toggle("on", !!pending && pending.kind === "decide");
  $("comment").classList.toggle("on", !!pending && pending.kind === "comment");
  if (pending && pending.kind === "decide") $("question").textContent = pending.question;
  const key = pending ? JSON.stringify(pending) : "";
  if (pending && pending.kind === "comment" && key !== shown) {
    suggestion = pending.suggestion;
    $("comment-text").value = suggestion;
    $("comment-text").focus();
  }
  shown = key;
  $("go").textContent = running ? "Stop" : "Start";
  document.querySelector(".panel").classList.toggle("running", running);
  const label = (key) => document.querySelector(`.seg[data-key="${key}"] [aria-pressed="true"]`)?.textContent || "";
  $("summary").textContent = [label("auto"), label("source"), label("full"), `cap ${$("cap").value}`].join("  /  ");
  $("status").textContent = running && !pending ? lastLine.replace(/^\S+\s+/, "") : "";
  $("go").classList.toggle("stop", running);
  paintSettings();
}

let lastLog = "", lastLine = "";
async function poll() {
  try {
    const s = await (await fetch("/state")).json();
    running = s.running;
    pending = s.pending;
    if (String(s.today) !== $("today").textContent) { $("today").classList.remove("bump"); void $("today").offsetWidth; $("today").classList.add("bump"); }
    $("today").textContent = s.today;
    today = s.today;
    const log = s.log.join("\n");
    lastLine = s.log[s.log.length - 1] || "";
    if (log !== lastLog) {
      lastLog = log;
      $("log").replaceChildren(...s.log.slice(-60).map((line) => Object.assign(document.createElement("li"), { textContent: line })));
      $("log").scrollTop = $("log").scrollHeight;
    }
    render();
  } catch (e) {}
  setTimeout(poll, 700);
}

function refreshScreen() {
  const img = new Image();
  img.onload = () => { $("screen").src = img.src; $("phone").classList.remove("down"); setTimeout(refreshScreen, 1000); };
  img.onerror = () => { $("phone").classList.add("down"); setTimeout(refreshScreen, 3000); };
  img.src = "/frame.png?t=" + Date.now();
}

fetch("/prompts").then((r) => r.json()).then((p) => { $("prompts").value = p.text; });
$("save-prompts").addEventListener("click", async () => {
  const r = await post("/prompts", { text: $("prompts").value });
  $("saved").textContent = r.error ? r.error : "Saved";
  setTimeout(() => { $("saved").textContent = ""; }, 4000);
});
$("cap").addEventListener("input", paintSettings);

document.addEventListener("pointermove", (e) => document.body.style.setProperty("--lx", (e.clientX / innerWidth * 100).toFixed(1) + "%"));

paintSettings();
poll();
refreshScreen();
</script>
</body>
</html>
