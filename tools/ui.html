<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hinge-automation</title>
<style>
  :root {
    --bg: #1b1215;
    --surface: #251a1e;
    --raised: #2f2226;
    --ink: #f4e8ec;
    --muted: #a8949b;
    --faint: #6f5c63;
    --rose: #e7a6c3;
    --rose-deep: #b9728f;
    --rose-ink: #2a1219;
    --lip: #120b0d;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    min-height: 100%;
    display: grid;
    grid-template-columns: auto minmax(340px, 540px);
    align-items: start;
    align-content: start;
    gap: 40px;
    justify-content: center;
    padding: 24px 32px;
  }

  .phone {
    height: calc(100vh - 48px);
    min-height: 520px;
    aspect-ratio: 415 / 923;
    border-radius: 38px;
    background: var(--lip);
    padding: 11px;
    position: sticky;
    top: 24px;
  }
  .phone img, .phone .off {
    width: 100%;
    height: 100%;
    border-radius: 22px;
    display: block;
    object-fit: cover;
    background: var(--surface);
  }
  .phone .off {
    display: none;
    place-items: center;
    text-align: center;
    padding: 24px;
    color: var(--muted);
  }
  .phone.down img { display: none; }
  .phone.down .off { display: grid; }

  .panel { display: flex; flex-direction: column; gap: 28px; padding: 8px 0 24px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font: italic 400 26px/1.1 var(--serif); letter-spacing: 0.2px; }
  .count { font: 400 44px/1 var(--serif); font-variant-numeric: tabular-nums; }
  .count small { font: 14px system-ui, sans-serif; color: var(--muted); margin-left: 6px; }

  .settings { display: grid; gap: 14px; }
  .row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 12px; }
  .row > span { color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface); padding: 4px; border-radius: 10px; width: fit-content; }
  .seg button {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; padding: 6px 12px; border-radius: 7px; cursor: pointer;
    transition: background-color 140ms, color 140ms;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .seg button:disabled { cursor: default; opacity: 0.55; }
  input[type=number] {
    width: 76px; font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid transparent; border-radius: 8px; padding: 6px 10px;
  }
  input[type=number]:focus, textarea:focus { outline: 2px solid var(--rose-deep); outline-offset: 1px; }
  .note { margin: -4px 0 0 108px; color: var(--rose); font-size: 13px; }
  .note:empty { display: none; }

  .go {
    align-self: flex-start;
    border: 0; border-radius: 10px; cursor: pointer;
    font: 600 15px system-ui, sans-serif;
    padding: 12px 22px;
    background: var(--rose); color: var(--rose-ink);
    transition: background-color 140ms;
  }
  .go:hover { background: #f0b9d1; }
  .go.stop { background: var(--raised); color: var(--ink); }
  .go.stop:hover { background: #3a2a2f; }

  .ask { background: var(--surface); border-radius: 16px; padding: 22px; display: none; }
  .ask.on { display: block; }
  .ask p:not(.hint) { margin: 0 0 18px; font: 400 20px/1.3 var(--serif); }
  .keys { display: flex; gap: 12px; flex-wrap: wrap; }
  .key {
    width: 92px; height: 88px;
    display: grid; grid-template-rows: 1fr auto; place-items: center;
    padding: 12px 0 10px;
    border: 0; border-radius: 12px; cursor: pointer;
    background: var(--raised); color: var(--ink);
    box-shadow: inset 0 -5px 0 var(--lip);
    transition: background-color 120ms, box-shadow 80ms, padding 80ms;
  }
  .key b { font: 400 34px/1 var(--serif); }
  .key small { font-size: 12px; color: var(--muted); }
  .key:hover { background: #3a2a2f; }
  .key:active, .key.hit { box-shadow: inset 0 -2px 0 var(--lip); padding-top: 15px; }
  .key.like { background: var(--rose); color: var(--rose-ink); }
  .key.like small { color: var(--rose-ink); opacity: 0.75; }
  .key.like:hover { background: #f0b9d1; }
  textarea {
    width: 100%; min-height: 76px; resize: vertical;
    font: 17px/1.4 system-ui, sans-serif; color: var(--ink);
    background: var(--bg); border: 0; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
  }
  .hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; }

  .log {
    margin: 0; padding: 0; list-style: none;
    font: 12.5px/1.6 ui-monospace, Consolas, monospace; color: var(--muted);
    max-height: 240px; overflow-y: auto;
  }
  .log li:last-child { color: var(--ink); }

  details { background: var(--surface); border-radius: 12px; padding: 14px 16px; }
  summary { cursor: pointer; color: var(--muted); }
  summary:hover { color: var(--ink); }
  details textarea { min-height: 220px; margin: 14px 0 10px; font-size: 14px; }
  .small { background: var(--raised); color: var(--ink); border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; cursor: pointer; }
  .small:hover { background: #3a2a2f; }
  .saved { color: var(--muted); font-size: 13px; margin-left: 10px; }

  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 24px; }
    .phone { position: static; height: auto; width: min(100%, 340px); min-height: 0; aspect-ratio: auto; justify-self: center; }
    .phone img, .phone .off { height: auto; aspect-ratio: 415 / 923; }
    .row { grid-template-columns: 1fr; gap: 6px; }
    .note { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="phone" id="phone">
    <img id="screen" alt="Live view of the emulator screen">
    <div class="off" id="off">Emulator window not found.<br>Start it with .\run-hinge.ps1</div>
  </div>

  <section class="panel">
    <header>
      <h1>hinge-automation</h1>
      <div class="count"><span id="today">0</span><small>of <span id="cap-shown">5</span> today</small></div>
    </header>

    <div class="settings" id="settings">
      <div class="row"><span>Mode</span>
        <div class="seg" data-key="auto">
          <button data-value="false">Ask me</button><button data-value="true">Auto</button>
        </div>
      </div>
      <p class="note" id="auto-note"></p>
      <div class="row"><span>Comment</span>
        <div class="seg" data-key="source">
          <button data-value="none">None</button><button data-value="list">From my list</button><button data-value="model">Vision model</button>
        </div>
      </div>
      <div class="row"><span>Scroll</span>
        <div class="seg" data-key="full">
          <button data-value="false">Random depth</button><button data-value="true">Whole profile</button>
        </div>
      </div>
      <div class="row"><span>Daily cap</span><input type="number" id="cap" min="1" max="100" value="5"></div>
    </div>

    <button class="go" id="go">Start</button>

    <div class="ask" id="decide">
      <p id="question"></p>
      <div class="keys">
        <button class="key like" data-answer="y"><b>y</b><small>like</small></button>
        <button class="key" data-answer="n"><b>n</b><small>skip</small></button>
        <button class="key" data-answer="q"><b>q</b><small>stop</small></button>
      </div>
      <p class="hint">Press y, n or q on your keyboard.</p>
    </div>

    <div class="ask" id="comment">
      <p>Comment to send with the like</p>
      <textarea id="comment-text" maxlength="300"></textarea>
      <div class="keys">
        <button class="key like" id="send"><b>&#8629;</b><small>send</small></button>
        <button class="key" id="bare"><b>-</b><small>no comment</small></button>
      </div>
      <p class="hint">Edit the text to send your own words. Printable ASCII only.</p>
    </div>

    <ul class="log" id="log"></ul>

    <details>
      <summary>My comment list (prompts.txt)</summary>
      <textarea id="prompts" spellcheck="true"></textarea>
      <button class="small" id="save-prompts">Save</button><span class="saved" id="saved"></span>
    </details>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const settings = { auto: "false", source: "list", full: "false" };
try { Object.assign(settings, JSON.parse(localStorage.getItem("hinge-settings") || "{}")); } catch (e) {}
try { $("cap").value = localStorage.getItem("hinge-cap") || 5; } catch (e) {}
let running = false, pending = null, suggestion = "";

function paintSettings() {
  document.querySelectorAll(".seg").forEach((seg) => {
    seg.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.value === settings[seg.dataset.key]));
      b.disabled = running;
    });
  });
  $("cap").disabled = running;
  $("auto-note").textContent = settings.auto === "true" ? "Auto likes every profile it scans until the daily cap, without asking." : "";
}

document.querySelectorAll(".seg").forEach((seg) => seg.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || running) return;
  settings[seg.dataset.key] = b.dataset.value;
  try { localStorage.setItem("hinge-settings", JSON.stringify(settings)); } catch (err) {}
  paintSettings();
}));

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  return r.json();
}

$("go").addEventListener("click", () => {
  if (running) return post("/stop");
  try { localStorage.setItem("hinge-cap", $("cap").value); } catch (e) {}
  post("/start", {
    cap: Number($("cap").value) || 5,
    auto: settings.auto === "true",
    full: settings.full === "true",
    source: settings.source,
    provider: "auto",
  });
});

function answer(value) { post("/answer", { answer: value }); pending = null; render(); }
document.querySelectorAll("[data-answer]").forEach((b) => b.addEventListener("click", () => answer(b.dataset.answer)));
$("send").addEventListener("click", () => {
  const text = $("comment-text").value.trim();
  answer(text === suggestion ? "" : text || "-");
});
$("bare").addEventListener("click", () => answer("-"));
document.addEventListener("keydown", (e) => {
  if (!pending || pending.kind !== "decide" || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const key = document.querySelector(`[data-answer="${e.key.toLowerCase()}"]`);
  if (!key) return;
  key.classList.add("hit");
  setTimeout(() => key.classList.remove("hit"), 120);
  answer(e.key.toLowerCase());
});
$("comment-text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); }
});

let shown = "";
function render() {
  $("decide").classList.toggle("on", !!pending && pending.kind === "decide");
  $("comment").classList.toggle("on", !!pending && pending.kind === "comment");
  if (pending && pending.kind === "decide") $("question").textContent = pending.question;
  const key = pending ? JSON.stringify(pending) : "";
  if (pending && pending.kind === "comment" && key !== shown) {
    suggestion = pending.suggestion;
    $("comment-text").value = suggestion;
    $("comment-text").focus();
  }
  shown = key;
  $("go").textContent = running ? "Stop" : "Start";
  $("go").classList.toggle("stop", running);
  paintSettings();
}

let lastLog = "";
async function poll() {
  try {
    const s = await (await fetch("/state")).json();
    running = s.running;
    pending = s.pending;
    $("today").textContent = s.today;
    $("cap-shown").textContent = running ? s.cap : $("cap").value;
    const log = s.log.join("\n");
    if (log !== lastLog) {
      lastLog = log;
      $("log").replaceChildren(...s.log.slice(-60).map((line) => Object.assign(document.createElement("li"), { textContent: line })));
      $("log").scrollTop = $("log").scrollHeight;
    }
    render();
  } catch (e) {}
  setTimeout(poll, 700);
}

function refreshScreen() {
  const img = new Image();
  img.onload = () => { $("screen").src = img.src; $("phone").classList.remove("down"); setTimeout(refreshScreen, 1000); };
  img.onerror = () => { $("phone").classList.add("down"); setTimeout(refreshScreen, 3000); };
  img.src = "/frame.png?t=" + Date.now();
}

fetch("/prompts").then((r) => r.json()).then((p) => { $("prompts").value = p.text; });
$("save-prompts").addEventListener("click", async () => {
  const r = await post("/prompts", { text: $("prompts").value });
  $("saved").textContent = r.error ? r.error : "Saved";
  setTimeout(() => { $("saved").textContent = ""; }, 4000);
});
$("cap").addEventListener("input", () => { if (!running) $("cap-shown").textContent = $("cap").value; });

paintSettings();
poll();
refreshScreen();
</script>
</body>
</html>
