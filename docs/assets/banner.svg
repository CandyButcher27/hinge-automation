<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="hinge-automation: a human-in-the-loop helper for Hinge on the Android emulator">
  <rect width="1280" height="400" fill="#f3eee4"/>
  <g fill="#1d1a22" opacity="0.07">
    <circle cx="1040" cy="200" r="260"/>
  </g>

  <text x="80" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#1d1a22" letter-spacing="-1">hinge-automation</text>
  <text x="82" y="200" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#5a5360">A human-in-the-loop helper for Hinge,</text>
  <text x="82" y="236" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#5a5360">running in the Android emulator.</text>

  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="20">
    <rect x="80" y="282" width="640" height="68" rx="8" fill="#1d1a22"/>
    <text x="104" y="312" fill="#a39cab">$ hinge.py run --cap 5</text>
    <text x="104" y="338" fill="#f3eee4">stopped here, 2 photo(s) on screen. like one? <tspan fill="#e0a86b">[y/n/q]</tspan></text>
  </g>

  <g transform="translate(930 40)">
    <rect x="0" y="0" width="200" height="340" rx="30" fill="#1d1a22"/>
    <rect x="10" y="12" width="180" height="316" rx="22" fill="#fbf8f2"/>
    <rect x="75" y="20" width="50" height="6" rx="3" fill="#1d1a22"/>

    <rect x="24" y="40" width="152" height="150" rx="10" fill="#d9cfbf"/>
    <circle cx="100" cy="100" r="26" fill="#c2b4a0"/>
    <path d="M58 190 q42 -60 84 0 z" fill="#c2b4a0"/>
    <circle cx="152" cy="166" r="15" fill="#1d1a22"/>
    <path d="M152 174 l-7.5 -7.5 a4.3 4.3 0 0 1 7.5 -5 a4.3 4.3 0 0 1 7.5 5 z" fill="#fbf8f2"/>

    <rect x="24" y="202" width="152" height="70" rx="10" fill="#ffffff" stroke="#e4ddd0"/>
    <rect x="36" y="218" width="90" height="7" rx="3.5" fill="#1d1a22" opacity="0.8"/>
    <rect x="36" y="234" width="120" height="6" rx="3" fill="#a39cab"/>
    <rect x="36" y="248" width="100" height="6" rx="3" fill="#a39cab"/>

    <rect x="24" y="284" width="152" height="30" rx="10" fill="#d9cfbf"/>
  </g>

  <g transform="translate(1110 250)">
    <circle cx="0" cy="0" r="30" fill="#e0a86b"/>
    <text x="0" y="8" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="24" font-weight="bold" fill="#1d1a22">y</text>
  </g>
</svg>
