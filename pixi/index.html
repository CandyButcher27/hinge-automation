<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hinge-automation</title>
<meta name="description" content="A human-in-the-loop Hinge helper that drives an Android emulator on your Windows PC.">
<style>
  :root {
    --walnut: #2b1810;
    --deep: #0d0705;
    --slat: #ffc47a;
    --card: #14100d;
    --stone: #d8cdbf;
    --muted: #9c8f80;
    --brass: #d4a35a;
    --white: #f3ece3;
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(0.19, 1, 0.22, 1);
    --sx: 0px;
    --shx: -34px;
    --shy: 46px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deep); }
  body { color: var(--white); font: 300 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  .room { position: fixed; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .sun {
    inset: -30%; width: auto; height: auto;
    background: repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,196,122,0.36) 64px 140px, transparent 160px 176px);
    transform: rotate(-31deg) translateX(var(--sx));
    filter: blur(16px);
    mix-blend-mode: screen;
    -webkit-mask-image: radial-gradient(48% 52% at 64% 40%, #000 30%, transparent 78%);
    mask-image: radial-gradient(48% 52% at 64% 40%, #000 30%, transparent 78%);
    opacity: 0;
    animation: lightup 2.6s var(--ease) 0.2s forwards;
  }
  .warm { background: radial-gradient(60% 60% at 66% 38%, rgba(255,150,70,0.20), transparent 70%); mix-blend-mode: screen; opacity: 0; animation: lightup 3s var(--ease) forwards; }
  @keyframes lightup { to { opacity: 1; } }
  .leaves { mix-blend-mode: multiply; filter: blur(7px); opacity: 0.6; }
  .vignette { background: radial-gradient(120% 95% at 60% 42%, transparent 40%, rgba(5,3,2,0.82) 100%); }
  .grain { opacity: 0.07; mix-blend-mode: overlay; z-index: 30; }

  .phone {
    position: absolute; z-index: 10;
    left: 54%; top: 50%;
    height: min(80vh, 880px); aspect-ratio: 1080 / 2400;
    border-radius: 13% / 6%;
    background: #0d0b0a;
    padding: 2.6%;
    transform: translate(-50%, -50%) rotate(-8deg) scale(1.03);
    box-shadow:
      inset 0 0 0 1.5px #3b3430,
      inset 0 0 0 3px #0a0908,
      0 0 0 1px rgba(212,163,90,0.28),
      calc(var(--shx) * 0.15) calc(var(--shy) * 0.15) 8px rgba(0,0,0,0.75),
      var(--shx) var(--shy) 70px rgba(0,0,0,0.7);
    opacity: 0;
    animation: settle 1.8s var(--ease) 0.6s forwards;
  }
  @keyframes settle { to { opacity: 1; transform: translate(-50%, -50%) rotate(-8deg) scale(1); } }
  .screenbox { position: relative; width: 100%; height: 100%; border-radius: 10.5% / 4.8%; overflow: hidden; background: #f4efe9; }
  .screenbox img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .screenbox.live img { display: block; }
  .screenbox.live .ph { display: none; }
  .punch { position: absolute; left: 50%; top: 2.2%; width: 3.4%; aspect-ratio: 1; border-radius: 50%; background: #070606; transform: translateX(-50%); z-index: 3; }
  .sheen { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(118deg, rgba(255,214,160,0.16) 0%, rgba(255,214,160,0.03) 34%, transparent 35%, transparent 62%, rgba(255,214,160,0.07) 63%, transparent 80%); }
  .ph { position: absolute; inset: 0; color: #1d1714; font-family: var(--sans); }
  .ph .head { padding: 15% 7% 4%; font: 600 clamp(14px, 2.1vh, 22px)/1.1 var(--sans); }
  .ph .head small { display: block; font-weight: 300; font-size: 0.55em; color: #7b6e63; margin-top: 4px; }
  .ph .photo { margin: 0 4.5% 4.5%; border-radius: 9px; overflow: hidden; position: relative; }
  .ph .photo svg { display: block; width: 100%; }
  .ph .heart { position: absolute; right: 5%; bottom: 5%; width: 15%; aspect-ratio: 1; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .ph .heart svg { width: 46%; }
  .ph .heart path { fill: none; stroke: #5a3d6b; stroke-width: 2.2; transition: fill 600ms var(--ease), stroke 600ms; }
  .ph .heart.hit path { fill: var(--brass); stroke: var(--brass); }
  .ph .prompt { margin: 0 4.5%; padding: 7% 6% 9%; background: #fff; border-radius: 9px; }
  .ph .prompt small { display: block; font-size: clamp(8px, 1.1vh, 12px); color: #6c6058; margin-bottom: 4px; }
  .ph .prompt p { margin: 0; font: 400 clamp(12px, 1.9vh, 20px)/1.2 var(--serif); }

  .tumbler { position: absolute; z-index: 9; left: 75%; top: 17%; width: min(22vh, 230px); aspect-ratio: 1; transform: translate(-50%, -50%); opacity: 0; animation: rise 1.6s var(--ease) 1.2s forwards; }
  .tumbler svg { width: 100%; height: 100%; overflow: visible; }

  .card {
    position: absolute; z-index: 11; left: 21%; top: 66%;
    width: min(360px, 30vw); padding: 26px 28px 22px;
    background: var(--card);
    transform: translate(-50%, -50%) rotate(5deg);
    box-shadow: inset 0 0 0 1px rgba(216,205,191,0.07), -14px 22px 34px rgba(0,0,0,0.65), -2px 3px 4px rgba(0,0,0,0.6);
    opacity: 0; animation: risecard 1.6s var(--ease) 1.5s forwards;
  }
  @keyframes risecard { from { opacity: 0; transform: translate(-50%, -46%) rotate(5deg); } to { opacity: 1; transform: translate(-50%, -50%) rotate(5deg); } }
  @keyframes rise { from { opacity: 0; translate: 0 10px; } to { opacity: 1; translate: 0 0; } }
  .card .lbl { font: 400 10px var(--sans); letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .card .line { margin: 14px 0 20px; min-height: 3.9em; font: italic 400 clamp(17px, 1.6vw, 22px)/1.3 var(--serif); color: var(--brass); text-shadow: 0 1px 0 rgba(0,0,0,0.6), 0 -1px 0 rgba(255,220,160,0.12); }
  .card .line.fade { opacity: 0; transition: opacity 500ms var(--ease); }
  .card .foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(212,163,90,0.25); padding-top: 12px; font: 400 12px var(--sans); color: var(--stone); letter-spacing: 0.3px; }
  .card .foot b { font: 400 22px var(--serif); color: var(--brass); font-variant-numeric: tabular-nums; margin-right: 4px; }
  .stamp { width: 26px; height: 24px; opacity: 0.15; transform: scale(0.9); transition: opacity 700ms var(--ease), transform 700ms var(--ease); }
  .stamp path { fill: var(--brass); }
  .stamp.on { opacity: 1; transform: scale(1); }

  .keys { position: absolute; z-index: 11; left: 74%; top: 74%; display: flex; gap: 14px; transform: rotate(-4deg); opacity: 0; animation: rise 1.4s var(--ease) 1.8s forwards; }
  .key {
    width: 64px; height: 64px; border: 0; border-radius: 12px; cursor: pointer; padding: 0;
    background: linear-gradient(160deg, #241b16, #120d0a);
    color: var(--stone); font: 400 26px var(--serif);
    box-shadow: inset 0 1px 0 rgba(255,230,190,0.12), 0 6px 0 #050302, -12px 16px 22px rgba(0,0,0,0.55);
    transition: transform 90ms, box-shadow 90ms, color 400ms;
  }
  .key.y { color: var(--brass); }
  .key:hover, .key:focus-visible { color: var(--white); outline: none; }
  .key.y:hover, .key.y:focus-visible { color: #f0c27e; }
  .key:focus-visible { box-shadow: inset 0 1px 0 rgba(255,230,190,0.12), 0 6px 0 #050302, -12px 16px 22px rgba(0,0,0,0.55), 0 0 0 1px var(--brass); }
  .key.down { transform: translateY(4px); box-shadow: inset 0 1px 0 rgba(255,230,190,0.08), 0 2px 0 #050302, -6px 8px 12px rgba(0,0,0,0.55); }
  .keys small { position: absolute; top: calc(100% + 18px); left: 2px; white-space: nowrap; font: 400 10px var(--sans); letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); }

  .brand, .top-r { position: absolute; z-index: 20; top: 26px; font: 400 15px var(--sans); color: var(--white); letter-spacing: 0.3px; text-decoration: none; opacity: 0; animation: rise 1.2s var(--ease) 1s forwards; }
  .brand { left: 30px; }
  .top-r { right: 30px; }
  .top-r:hover { color: var(--brass); }
  .say { position: absolute; z-index: 20; left: 30px; bottom: 26px; margin: 0; font: 400 clamp(26px, 3vw, 44px)/1.04 var(--serif); color: var(--white); opacity: 0; animation: rise 1.6s var(--ease) 2.1s forwards; }
  .say em { color: var(--brass); }
  .note { position: absolute; z-index: 20; right: 30px; bottom: 28px; margin: 0; max-width: 300px; text-align: right; font: 300 12px/1.5 var(--sans); color: var(--muted); opacity: 0; animation: rise 1.4s var(--ease) 2.3s forwards; }

  @media (max-width: 820px) {
    .phone { left: 50%; top: 46%; height: 60vh; }
    .tumbler { left: 86%; top: 12%; width: 18vh; }
    .card { left: 30%; top: 84%; width: 54vw; padding: 16px 18px 14px; }
    .card .line { font-size: 15px; min-height: 2.6em; margin: 8px 0 10px; }
    .keys { left: auto; right: 16px; top: auto; bottom: 64px; gap: 8px; }
    .key { width: 46px; height: 46px; font-size: 20px; }
    .keys small, .note { display: none; }
    .say { display: none; }
    .brand { left: 16px; top: 16px; }
    .top-r { right: 16px; top: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<div class="room" id="room">
  <svg class="layer" aria-hidden="true" preserveAspectRatio="none">
    <defs>
      <filter id="wood" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.003 0.32" numOctaves="5" seed="7"/>
        <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.025  0 0 0 0 0.012  2.2 0 0 0 -0.85"/>
      </filter>
      <filter id="wood2" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.0015 0.03" numOctaves="3" seed="2"/>
        <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.36  0 0 0 0 0.2  0 1.2 0 0 -0.55"/>
      </filter>
      <filter id="wood3" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="turbulence" baseFrequency="0.0016 0.07" numOctaves="2" seed="11"/>
        <feColorMatrix type="matrix" values="0 0 0 0 0.03  0 0 0 0 0.012  0 0 0 0 0.005  -9 0 0 0 1.25"/>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="#2b1810"/>
    <g transform="rotate(-14 800 500)">
      <rect x="-60%" y="-60%" width="220%" height="220%" filter="url(#wood2)"/>
      <rect x="-60%" y="-60%" width="220%" height="220%" filter="url(#wood)"/>
      <rect x="-60%" y="-60%" width="220%" height="220%" filter="url(#wood3)" opacity="0.55"/>
    </g>
  </svg>
  <div class="layer warm"></div>
  <div class="layer sun" id="sun"></div>
  <svg class="layer leaves" id="leaves" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <div class="layer vignette"></div>

  <div class="tumbler" aria-hidden="true">
    <svg viewBox="-110 -110 220 220">
      <defs>
        <radialGradient id="liq" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#e09a45"/><stop offset="0.6" stop-color="#9c5418"/><stop offset="1" stop-color="#4a220a"/></radialGradient>
        <filter id="caustic" x="-50%" y="-50%" width="200%" height="200%">
          <feTurbulence id="ctex" type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4" result="t"/>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="18"/>
          <feGaussianBlur stdDeviation="3"/>
        </filter>
      </defs>
      <ellipse cx="-52" cy="58" rx="86" ry="60" fill="#000" opacity="0.55" filter="blur(10px)" style="filter: blur(10px)"/>
      <g filter="url(#caustic)" style="mix-blend-mode: screen">
        <ellipse cx="-58" cy="62" rx="62" ry="40" fill="#f2a24c" opacity="0.5"/>
        <ellipse cx="-66" cy="66" rx="26" ry="14" fill="#ffd08a" opacity="0.8"/>
      </g>
      <circle r="78" fill="rgba(255,240,220,0.05)" stroke="rgba(255,236,210,0.32)" stroke-width="2"/>
      <circle r="70" fill="none" stroke="rgba(255,236,210,0.12)" stroke-width="6"/>
      <circle id="whisky" r="60" fill="url(#liq)" opacity="0.88"/>
      <g id="ice" opacity="0.85">
        <rect x="-26" y="-34" width="40" height="40" rx="7" fill="rgba(255,240,225,0.22)" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" transform="rotate(18)"/>
        <rect x="6" y="-4" width="32" height="32" rx="6" fill="rgba(255,240,225,0.16)" stroke="rgba(255,255,255,0.35)" stroke-width="1" transform="rotate(-12)"/>
      </g>
      <g stroke="rgba(255,236,210,0.16)" stroke-width="1" id="facets"></g>
      <path d="M40 -62 A 74 74 0 0 1 72 -12" fill="none" stroke="rgba(255,250,240,0.7)" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="phone" id="phone">
    <div class="screenbox" id="screenbox">
      <img id="screen" alt="Live view of the emulator screen">
      <div class="ph" id="ph"></div>
      <div class="punch"></div>
      <div class="sheen"></div>
    </div>
  </div>

  <div class="card" aria-live="polite">
    <div class="lbl">Tonight's line</div>
    <p class="line" id="line"></p>
    <div class="foot"><span><b id="count">0</b>of 5 tonight</span>
      <svg class="stamp" id="stamp" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 20 C 5 15 1 11 1 6.5 C 1 3.5 3.4 1 6.4 1 C 8.6 1 10.6 2.3 12 4.3 C 13.4 2.3 15.4 1 17.6 1 C 20.6 1 23 3.5 23 6.5 C 23 11 19 15 12 20Z"/></svg>
    </div>
  </div>

  <div class="keys" role="group" aria-label="Answer the profile on screen">
    <button class="key y" data-k="y" aria-label="y, like">y</button>
    <button class="key" data-k="n" aria-label="n, skip">n</button>
    <button class="key" data-k="q" aria-label="q, new evening">q</button>
    <small>like · skip · stop</small>
  </div>

  <div class="brand">hinge-automation</div>
  <a class="top-r" href="https://github.com/CandyButcher27/hinge-automation">GitHub</a>
  <p class="say">Fewer likes.<br>Each one <em>meant</em> —</p>
  <p class="note">It scrolls like a person, waits for your yes, and stops at five a day.</p>
  <svg class="layer grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? 0 : ms));
const LINES = ["hi you look really cute","okay this photo is adorable","you have such a pretty smile","hi! you look really lovely here","this might be my favourite photo on here","you look so cute here","hey, love this picture","okay this one made me stop scrolling","this is such a good photo of you","you look so happy here, i love that","the vibe in this picture is immaculate","not gonna lie, this photo is my favourite","you have really nice energy in this one","okay you look great here","this photo feels like a good day","where was this taken? it looks lovely","okay i need the story behind this photo","this picture has main character energy","you look like you'd be really fun to hang out with","love the smile in this one","this is a really nice shot, who took it?","okay this photo is a whole mood","hi, your smile in this one is lovely","you look so comfortable in this one, love it","this picture is so wholesome","okay the lighting here is perfect","this looks like a memory worth keeping","hey! this one's really sweet","you look really kind in this photo","i like this one a lot","okay you pull this look off really well","this photo just looks like a good time","hi, had to say this photo is lovely","you have a great laugh, i can tell from this one","this might be the best photo on the app today","okay this is a really cute picture","the joy in this photo is contagious","hi! this made me smile","you look effortlessly cool here","okay what was happening right before this photo"];
const PALS = [["#c98f6b", "#3d2b22", "#f1d5b8"], ["#7d8f86", "#22302b", "#e3d9c6"], ["#b77d86", "#3b2026", "#f0d8d0"], ["#8f7aa8", "#2a2236", "#e8dff0"], ["#c9a66b", "#3a2c18", "#f4e6c8"]];
const PEOPLE = [["Maya", 27, "Bandra"], ["Ines", 26, "Indiranagar"], ["Noor", 29, "Hauz Khas"], ["Clara", 25, "Koramangala"], ["Rhea", 28, "Kemps Corner"]];
const PROMPTS = [["My simple pleasures", "Coffee that's too hot, a window seat, the first page of a new book."], ["I go crazy for", "Night markets and old Bollywood songs."], ["Together, we could", "Find the best dumplings in the city and argue about the ranking."], ["The way to win me over is", "Send me a song you think I haven't heard."]];

function portrait([bg, fig, sun], seed) {
  const w = 1000, h = 1180, hx = w * (0.38 + (seed % 3) * 0.12);
  return `<svg viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${bg}"/><circle cx="${w * (0.3 + (seed % 4) * 0.12)}" cy="${h * 0.3}" r="${w * 0.2}" fill="${sun}" opacity="0.55"/><path d="M0 ${h * 0.72} C ${w * 0.3} ${h * 0.66} ${w * 0.6} ${h * 0.76} ${w} ${h * 0.68} L${w} ${h} L0 ${h}Z" fill="${fig}" opacity="0.35"/><circle cx="${hx}" cy="${h * 0.5}" r="${w * 0.12}" fill="${fig}"/><path d="M${hx - w * 0.3} ${h} C ${hx - w * 0.28} ${h * 0.72} ${hx - w * 0.12} ${h * 0.64} ${hx} ${h * 0.64} C ${hx + w * 0.12} ${h * 0.64} ${hx + w * 0.28} ${h * 0.72} ${hx + w * 0.3} ${h}Z" fill="${fig}"/></svg>`;
}

let who = 0;
function profile() {
  const [name, age, place] = PEOPLE[who % PEOPLE.length];
  const pr = PROMPTS[who % PROMPTS.length];
  $("ph").innerHTML = `<div class="head">${name}<small>${age} · ${place}</small></div>
    <div class="photo">${portrait(PALS[who % PALS.length], who)}<div class="heart" id="heart"><svg viewBox="0 0 24 22"><path d="M12 20 C 5 15 1 11 1 6.5 C 1 3.5 3.4 1 6.4 1 C 8.6 1 10.6 2.3 12 4.3 C 13.4 2.3 15.4 1 17.6 1 C 20.6 1 23 3.5 23 6.5 C 23 11 19 15 12 20Z"/></svg></div></div>
    <div class="prompt"><small>${pr[0]}</small><p>${pr[1]}</p></div>
    <div class="photo" style="margin-top:4.5%">${portrait(PALS[(who + 2) % PALS.length], who + 1)}</div>`;
  who++;
}

/* tumbler facets */
for (let i = 0; i < 24; i++) {
  const a = (i / 24) * Math.PI * 2, l = document.createElementNS(NS, "line");
  l.setAttribute("x1", Math.cos(a) * 71); l.setAttribute("y1", Math.sin(a) * 71);
  l.setAttribute("x2", Math.cos(a) * 78); l.setAttribute("y2", Math.sin(a) * 78);
  $("facets").appendChild(l);
}

/* leaf shadows */
const branches = [];
function leafBranch(x, y, ang, n, len) {
  const g = document.createElementNS(NS, "g");
  let d = "";
  for (let i = 0; i < n; i++) {
    const t = i / n, px = x + Math.cos(ang) * len * t, py = y + Math.sin(ang) * len * t;
    const side = i % 2 ? 1 : -1, la = ang + side * rand(0.6, 1.0), s = rand(0.8, 1.3);
    d += `<path transform="translate(${px} ${py}) rotate(${la * 57.3}) scale(${s})" d="M0 0 C 26 -18 70 -16 100 0 C 70 16 26 18 0 0Z"/>`;
  }
  g.innerHTML = `<path d="M${x} ${y} L${x + Math.cos(ang) * len} ${y + Math.sin(ang) * len}" stroke="#000" stroke-width="5" fill="none"/>${d}`;
  g.setAttribute("fill", "#000");
  $("leaves").appendChild(g);
  branches.push({ g, x, y, ph: rand(0, 6), amp: rand(1.2, 2.6), sp: rand(0.6, 1.1) });
}
leafBranch(1640, -40, 2.35, 9, 520);
leafBranch(1660, 260, 2.75, 7, 420);
leafBranch(1300, -60, 1.95, 6, 360);

/* the card and the keys */
let liked = 0, busy = false, idleTimer = 0;
async function write(text) {
  const el = $("line");
  el.classList.add("fade");
  await wait(500);
  el.textContent = "";
  el.classList.remove("fade");
  for (const ch of text) {
    el.textContent += ch;
    await wait(Math.exp(rand(3.5, 4.5)) + (ch === " " ? 70 : 0));
  }
}
function press(k) {
  const b = document.querySelector(`.key[data-k="${k}"]`);
  b.classList.add("down");
  setTimeout(() => b.classList.remove("down"), 160);
}
async function answer(k) {
  press(k);
  armIdle();
  if (busy) return;
  busy = true;
  if (k === "q") {
    liked = 0;
    $("count").textContent = 0;
    $("stamp").classList.remove("on");
    profile();
    await write(pick(LINES));
  } else if (liked >= 5) {
    await write("That's tonight. See you tomorrow.");
  } else if (k === "y") {
    const h = $("heart");
    if (h) h.classList.add("hit");
    $("stamp").classList.remove("on");
    await write(pick(LINES));
    liked++;
    $("count").textContent = liked;
    $("stamp").classList.add("on");
    await wait(1600);
    if (liked >= 5) await write("That's tonight. See you tomorrow.");
    else profile();
  } else {
    profile();
    await write(pick(LINES));
  }
  busy = false;
}
let auto = 0;
function armIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { answer(liked >= 5 ? "q" : (auto++ % 3 === 1 ? "n" : "y")); }, 7000);
}
document.querySelectorAll(".key").forEach((b) => b.addEventListener("click", () => answer(b.dataset.k)));
document.addEventListener("keydown", (e) => { const k = e.key.toLowerCase(); if (["y", "n", "q"].includes(k)) answer(k); });

/* the pointer is the sun */
let px = 0, py = 0, sx = 0, sy = 0, vx = 0, vy = 0, running = true;
addEventListener("pointermove", (e) => { px = e.clientX / innerWidth - 0.5; py = e.clientY / innerHeight - 0.5; });
const room = document.documentElement.style, ctex = $("ctex");
function frame(now) {
  if (!running) return;
  vx = (vx + (px - sx) * 0.02) * 0.86; sx += vx;
  vy = (vy + (py - sy) * 0.02) * 0.86; sy += vy;
  room.setProperty("--sx", (Math.sin(now / 9500) * 50 + sx * 120) + "px");
  room.setProperty("--shx", (-34 - sx * 40) + "px");
  room.setProperty("--shy", (46 - sy * 30) + "px");
  for (const b of branches) {
    const a = Math.sin(now / 1000 * b.sp + b.ph) * b.amp + Math.sin(now / 2700 + b.ph) * b.amp * 0.6;
    b.g.setAttribute("transform", `rotate(${a} ${b.x} ${b.y})`);
  }
  ctex.setAttribute("baseFrequency", (0.05 + Math.sin(now / 700) * 0.012).toFixed(4) + " " + (0.06 + Math.cos(now / 900) * 0.012).toFixed(4));
  $("whisky").setAttribute("r", 60 + Math.sin(now / 1600) * 0.8);
  $("ice").setAttribute("transform", `rotate(${Math.sin(now / 5000) * 6})`);
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => {
  running = !document.hidden;
  if (running && !reduced) requestAnimationFrame(frame);
});

/* live emulator when served by tools/ui.py */
function refreshScreen() {
  const img = new Image();
  img.onload = () => { $("screen").src = img.src; $("screenbox").classList.add("live"); setTimeout(refreshScreen, 1000); };
  img.onerror = () => { $("screenbox").classList.remove("live"); setTimeout(refreshScreen, 3000); };
  img.src = "/frame.png?t=" + Date.now();
}
if (location.protocol.startsWith("http")) fetch("/state").then((r) => r.ok && refreshScreen()).catch(() => {});

profile();
if (reduced) {
  $("line").textContent = LINES[16];
} else {
  requestAnimationFrame(frame);
  setTimeout(() => write(pick(LINES)), 2200);
}
armIdle();
</script>
</body>
